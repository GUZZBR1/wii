<!doctype html>
<!-- Benchmark local de inferência do PoseLandmarker no worker real do build.
     Uso: `npm run build && cp scripts/pose-bench.html dist/bench.html && npm run preview`,
     depois abra http://localhost:4173/bench.html. Resultados em window.BENCH / console.
     Opcional: copie uma foto com pessoa para dist/pose.jpg para medir o caminho "tracked". -->
<meta charset="utf-8">
<title>pose bench</title>
<script type="module">
// Descobre o chunk do worker (nome tem hash do build) a partir do bundle principal.
const indexHtml = await (await fetch('/')).text();
const mainJs = indexHtml.match(/src="([^"]*index-[^"]+\.js)"/)[1];
const mainSrc = await (await fetch(mainJs)).text();
const WORKER_URL = '/' + mainSrc.match(/assets\/pose\.worker-[A-Za-z0-9_-]+\.js/)[0];
// wasm dir = versão do tasks-vision; bundle guarda só "1.2.3" → sonda HEAD cada semver único.
const semvers = [...new Set(mainSrc.match(/\d+\.\d+\.\d+/g))];
let WASM = null;
for (const v of semvers) {
  const probe = `/mediapipe/wasm-${v}/vision_wasm_module_internal.js`;
  const res = await fetch(probe, { method: 'HEAD' });
  // vite preview/dev respondem 200+index.html em rotas inexistentes (SPA fallback) — exige JS de verdade
  if (res.ok && (res.headers.get('content-type') ?? '').includes('javascript')) { WASM = location.origin + `/mediapipe/wasm-${v}`; break; }
}
if (!WASM) throw new Error('dir wasm versionado não encontrado');
// nome do modelo = sha8 do conteúdo, derivável do SHA256SUMS servido
const sums = await (await fetch('/mediapipe/models/SHA256SUMS')).text();
const sha8 = sums.match(/[0-9a-f]{64}/)[0].slice(0, 8);
const MODEL = location.origin + `/mediapipe/models/pose_landmarker_lite.${sha8}.task`;
const W = 640, H = 480, WARMUP = 8, FRAMES = 60;

function drawPerson(ctx) {
  ctx.fillStyle = '#8aa0b4'; ctx.fillRect(0, 0, W, H);
  const skin = '#d9a875', cloth = '#3d5a80';
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(W / 2, 95, 26, 32, 0, 0, 7); ctx.fill();
  ctx.fillRect(W / 2 - 10, 122, 20, 22);
  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 52, 145); ctx.lineTo(W / 2 + 52, 145);
  ctx.lineTo(W / 2 + 38, 285); ctx.lineTo(W / 2 - 38, 285); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = cloth; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(W / 2 - 48, 158); ctx.lineTo(W / 2 - 118, 225); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 + 48, 158); ctx.lineTo(W / 2 + 118, 225); ctx.stroke();
  ctx.strokeStyle = '#20304a';
  ctx.beginPath(); ctx.moveTo(W / 2 - 20, 285); ctx.lineTo(W / 2 - 34, 440); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2 + 20, 285); ctx.lineTo(W / 2 + 34, 440); ctx.stroke();
}

function stats(a) {
  if (!a.length) return { n: 0 };
  const s = [...a].sort((x, y) => x - y);
  const q = (p) => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  return { n: s.length, min: +s[0].toFixed(2), p50: +q(0.5).toFixed(2), p90: +q(0.9).toFixed(2), p99: +q(0.99).toFixed(2), max: +s[s.length - 1].toFixed(2), mean: +(s.reduce((x, y) => x + y, 0) / s.length).toFixed(2) };
}

async function bench(delegate, canvas, label) {
  const worker = new Worker(WORKER_URL, { type: 'module' });
  const out = { input: label, requested: delegate, times: [], bitmapMs: [], detected: 0, empty: 0, errors: [] };
  const tInit = performance.now();
  let lastTs = 0;
  const ready = await new Promise((resolve) => {
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'READY') { out.initMs = +(performance.now() - tInit).toFixed(1); out.delegate = m.delegate; resolve(true); }
      else if (m.type === 'FALLBACK') out.fellBack = true;
      else if (m.type === 'ERROR') { out.errors.push(m.message); if (m.fatal) resolve(false); }
    };
    worker.postMessage({ type: 'INIT', delegate, wasmBaseUrl: WASM, modelUrl: MODEL });
    setTimeout(() => resolve(false), 45_000);
  });
  if (!ready) { worker.terminate(); return out; }

  for (let i = 0; i < WARMUP + FRAMES; i++) {
    const tb = performance.now();
    const bitmap = await createImageBitmap(canvas);
    const bitmapMs = performance.now() - tb;
    const ts = Math.max(performance.now(), lastTs + 0.01); lastTs = ts;
    const t0 = performance.now();
    worker.postMessage({ type: 'FRAME', timestampMs: ts, bitmap }, [bitmap]);
    const res = await new Promise((resolve) => {
      const to = setTimeout(() => resolve({ type: 'TIMEOUT' }), 15_000);
      worker.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'POSE' || m.type === 'ERROR') { clearTimeout(to); resolve(m); }
        else if (m.type === 'FALLBACK') out.fellBack = true;
      };
    });
    const dt = performance.now() - t0;
    if (i >= WARMUP) {
      out.bitmapMs.push(bitmapMs);
      if (res.type === 'POSE') { out.times.push(dt); if (res.landmarks?.length) out.detected++; else out.empty++; }
      else { out.errors.push(res.type === 'TIMEOUT' ? 'frame timeout >15s' : res.message ?? 'unknown'); }
      if (i % 10 === 0) console.log('progress', label, delegate, i, 'det:', out.detected, 'err:', out.errors.length);
      if (out.errors.length > 3) break;
    } else if (res.type !== 'POSE') { out.errors.push('warmup: ' + (res.message ?? res.type)); break; }
  }
  out.perFrame = stats(out.times);
  out.bitmap = stats(out.bitmapMs);
  worker.terminate();
  return out;
}

// foto real opcional: coloque qualquer jpg com pessoa em dist/pose.jpg para medir o caminho "tracked"
let photo = null;
try {
  const img = new Image();
  img.src = '/pose.jpg';
  await img.decode();
  const photoH = Math.round(img.naturalHeight * (640 / img.naturalWidth));
  photo = new OffscreenCanvas(640, photoH);
  photo.getContext('2d').drawImage(img, 0, 0, 640, photoH);
} catch { console.log('sem /pose.jpg — rodando só a figura sintética'); }

const stick = new OffscreenCanvas(W, H);
drawPerson(stick.getContext('2d'));

const runs = [];
window.BENCH = { runs, ua: navigator.userAgent, hwc: navigator.hardwareConcurrency };
if (photo) {
  runs.push(await bench('GPU', photo, 'photo-640'));
  runs.push(await bench('CPU', photo, 'photo-640'));
}
runs.push(await bench('CPU', stick, 'stick-640'));
runs.push(await bench('GPU', stick, 'stick-640'));
window.BENCH_DONE = true;
console.log('BENCH', JSON.stringify(window.BENCH));
</script>
